[tool.poetry]
name = "cruise-price-monitor"
version = "0.1.0"
description = "Monitoramento e alertas de preços de cruzeiros"
authors = ["Cruise Price Monitor Team <dev@example.com>"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.111.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }
sqlalchemy = "^2.0.30"
alembic = "^1.13.1"
psycopg2-binary = "^2.9.9"
pydantic = "^2.7.0"
requests = "^2.31.0"
beautifulsoup4 = "^4.12.0"
loguru = "^0.7.2"
apscheduler = "^3.10.4"
python-dotenv = "^1.0.1"
httpx = "^0.27.0"
prometheus-client = "^0.20.0"
email-validator = "^2.1.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
black = "^24.4.0"
flake8 = "^7.0.0"
mypy = "^1.10.0"
isort = "^5.13.0"

[tool.black]
line-length = 88
target-version = ["py312"]
include = "\\.pyi?$"

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=1.7.0"]
build-backend = "poetry.core.masonry.api"
